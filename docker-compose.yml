# Local full stack: `cp .env.example .env && docker compose up --build`, then open http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: social
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: social
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social -d social"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Not published to the host; use `docker compose exec db psql -U social` to inspect.

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: production # schema comes from Alembic, not create_all
      DATABASE_URL: postgresql+asyncpg://social:${POSTGRES_PASSWORD}@db:5432/social
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (see .env.example)}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
      COOKIE_SECURE: "false" # plain http on localhost
    ports:
      - "${BACKEND_PORT:-8000}:8000" # API docs + WebSocket for the browser
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
